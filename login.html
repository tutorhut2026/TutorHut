<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – TutorHut</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>if(localStorage.theme==='dark')document.documentElement.dataset.theme='dark'</script>
</head>
<body>

<div class="auth-wrapper">
  <div style="width:100%;max-width:480px">

    <div class="text-center mb-4">
      <a href="index.html" class="auth-logo d-block">Tutor<span>Hut</span></a>
      <p class="text-muted small mb-0">Sign in to your account</p>
    </div>

    <div class="auth-card" style="max-width:100%">

      <!-- Tab selector -->
      <div class="d-flex rounded-3 mb-4 p-1" style="background:#F1F5F9;gap:4px" id="tab-bar">
        <button type="button" id="tab-student"
          class="btn btn-primary flex-grow-1 fw-600"
          onclick="setTab('student')">
          <i class="bi bi-mortarboard me-2"></i>Student
        </button>
        <button type="button" id="tab-tutor"
          class="btn btn-outline-secondary flex-grow-1 fw-600"
          style="border:none;background:transparent"
          onclick="setTab('tutor')">
          <i class="bi bi-person-workspace me-2"></i>Tutor
        </button>
      </div>

      <p class="text-muted small mb-3" id="tab-hint">
        Sign in to browse tutors and manage your sessions.
      </p>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
            <input id="login-email" type="email" class="form-control border-start-0" placeholder="you@example.com" required />
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input id="login-pwd" type="password" class="form-control border-start-0" placeholder="Your password" required />
            <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePwd()">
              <i class="bi bi-eye" id="pwd-eye"></i>
            </button>
          </div>
        </div>

        <div class="alert alert-danger d-none" id="login-error"></div>
        <div class="alert alert-success d-none" id="login-ok">
          <i class="bi bi-check-circle-fill me-2"></i>Signed in! Redirecting…
        </div>

        <button id="login-btn" type="submit" class="btn btn-primary btn-lg w-100">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <!-- Google Sign-In (student tab only) -->
      <div id="google-section" class="mt-4">
        <div class="d-flex align-items-center gap-2 mb-3">
          <div class="flex-grow-1" style="height:1px;background:var(--border)"></div>
          <span class="small text-muted">or</span>
          <div class="flex-grow-1" style="height:1px;background:var(--border)"></div>
        </div>
        <button type="button" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2" id="google-btn" onclick="googleSignIn()">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <div class="divider mt-4"></div>
      <p class="text-center small text-muted mb-0" id="register-hint">
        New student? <a href="student-register.html">Create a free account</a>
      </p>
    </div>

    <p class="text-center small text-muted mt-3" id="other-hint">
      Are you a tutor? <a href="#" onclick="setTab('tutor');return false">Switch to Tutor tab</a> · <a href="tutor-register.html">Apply to join</a>
    </p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script>
  let activeTab = "student";

  function setTab(tab) {
    activeTab = tab;
    const stu = document.getElementById("tab-student");
    const tut = document.getElementById("tab-tutor");
    const hint = document.getElementById("tab-hint");
    const regHint = document.getElementById("register-hint");
    const othHint = document.getElementById("other-hint");

    if (tab === "student") {
      stu.classList.replace("btn-outline-secondary", "btn-primary");
      stu.style.background = "";
      tut.classList.replace("btn-primary", "btn-outline-secondary");
      tut.style.background = "transparent";
      hint.textContent = "Sign in to browse tutors and manage your sessions.";
      regHint.innerHTML = 'New student? <a href="student-register.html">Create a free account</a>';
      othHint.innerHTML = 'Are you a tutor? <a href="#" onclick="setTab(\'tutor\');return false">Switch to Tutor tab</a> · <a href="tutor-register.html">Apply to join</a>';
    } else {
      tut.classList.replace("btn-outline-secondary", "btn-primary");
      tut.style.background = "";
      stu.classList.replace("btn-primary", "btn-outline-secondary");
      stu.style.background = "transparent";
      hint.textContent = "Sign in to check your application status and tutor dashboard.";
      regHint.innerHTML = 'New tutor? <a href="tutor-register.html">Apply to join TutorHut</a>';
      othHint.innerHTML = 'Are you a student? <a href="#" onclick="setTab(\'student\');return false">Switch to Student tab</a>';
    }
  }

  function togglePwd() {
    const inp = document.getElementById("login-pwd");
    const eye = document.getElementById("pwd-eye");
    inp.type = inp.type === "password" ? "text" : "password";
    eye.className = inp.type === "text" ? "bi bi-eye-slash" : "bi bi-eye";
  }

  function setGoogleVisibility(tab) {
    const gs = document.getElementById("google-section");
    if (gs) gs.style.display = tab === "student" ? "" : "none";
  }

  const _origSetTab = setTab;
  setTab = function(tab) { _origSetTab(tab); setGoogleVisibility(tab); };

  // Pre-select tab from URL param
  const urlType = new URLSearchParams(window.location.search).get("type");
  if (urlType === "tutor") setTab("tutor");
</script>
<script type="module">
  import {
    auth, signInWithEmailAndPassword, signOut, authErrorMessage,
    GoogleAuthProvider, signInWithPopup, updateProfile,
    ADMIN_EMAIL, getTutorByUid
  } from "./js/firebase.js";

  const err = document.getElementById("login-error");

  window.googleSignIn = async function() {
    const btn = document.getElementById("google-btn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in…';
    err.classList.add("d-none");
    try {
      const provider = new GoogleAuthProvider();
      const { user }  = await signInWithPopup(auth, provider);
      const dn = user.displayName || "";

      if (dn.startsWith("student:")) {
        window.location.href = "student-dashboard.html";
      } else if (dn.startsWith("tutor:")) {
        await signOut(auth);
        err.textContent = "This Google account is linked to a tutor profile. Tutors sign in with email and password.";
        err.classList.remove("d-none");
        btn.disabled = false;
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg> Continue with Google`;
      } else {
        // New Google user — register as student
        const firstName = (user.displayName || "Student").split(" ")[0];
        await updateProfile(user, { displayName: `student:${firstName}` });
        window.location.href = "browse-tutors.html";
      }
    } catch (ex) {
      if (ex.code !== "auth/popup-closed-by-user") {
        err.textContent = authErrorMessage(ex.code);
        err.classList.remove("d-none");
      }
      btn.disabled = false;
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg> Continue with Google`;
    }
  };

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn  = document.getElementById("login-btn");
    const err  = document.getElementById("login-error");
    const ok   = document.getElementById("login-ok");
    const email = document.getElementById("login-email").value.trim();
    const pwd   = document.getElementById("login-pwd").value;

    err.classList.add("d-none");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in…';

    try {
      const { user } = await signInWithEmailAndPassword(auth, email, pwd);
      const dn = user.displayName || "";
      const tab = window.activeTab;

      let redirect = null;

      if (tab === "student") {
        if (dn.startsWith("student:")) {
          redirect = "student-dashboard.html";
        } else if (email === ADMIN_EMAIL) {
          err.textContent = "Admin accounts must use the Tutor tab.";
          err.classList.remove("d-none");
          await auth.signOut();
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
          return;
        } else {
          err.textContent = "This account is not registered as a student. Try the Tutor tab.";
          err.classList.remove("d-none");
          await auth.signOut();
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
          return;
        }
      } else {
        // Tutor tab handles tutors AND admin
        if (email === ADMIN_EMAIL) {
          redirect = "admin-dashboard.html";
        } else if (dn.startsWith("tutor:")) {
          // Check Sheets record: deleted tutors have no record; frozen/removed ones are blocked.
          const record = await getTutorByUid(user.uid);
          if (record === null) {
            await signOut(auth);
            err.textContent = "No tutor account found. Your application may have been removed. Please contact TutorHut admin.";
            err.classList.remove("d-none");
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
            return;
          }
          if (record.status === "frozen" || record.status === "banned" || record.status === "removed") {
            await signOut(auth);
            err.textContent = "Your account has been suspended. Please contact TutorHut admin.";
            err.classList.remove("d-none");
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
            return;
          }
          redirect = "tutor-dashboard.html";
        } else {
          err.textContent = "This account is not registered as a tutor. Try the Student tab.";
          err.classList.remove("d-none");
          await signOut(auth);
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
          return;
        }
      }

      ok.classList.remove("d-none");
      btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Redirecting…';
      setTimeout(() => { window.location.href = redirect; }, 1000);

    } catch (ex) {
      err.textContent = authErrorMessage(ex.code);
      err.classList.remove("d-none");
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
    }
  });
</script>
<script src="js/theme.js"></script>
</body>
</html>
