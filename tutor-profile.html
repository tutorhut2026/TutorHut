<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutor Profile – TutorHut</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>if(localStorage.theme==='dark')document.documentElement.dataset.theme='dark'</script>
  <style>
    .profile-avatar {
      width: 96px; height: 96px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .rate-table td { padding: .35rem .6rem; font-size: .9rem; vertical-align: middle; }
    .rate-table tr:last-child td { border-bottom: 0; }
    .avail-chip {
      display: inline-block; padding: .25rem .65rem; border-radius: 20px;
      font-size: .78rem; background: var(--accent-light); color: #92400E;
      margin: .15rem;
    }
    .skeleton { background: var(--border); border-radius: 6px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .review-placeholder { border: 2px dashed var(--border); border-radius: 12px; padding: 2rem; text-align: center; color: var(--text-muted); }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top" id="site-navbar"></nav>

<div class="page-header" id="profile-header">
  <div class="container">
    <nav aria-label="breadcrumb" class="mb-2">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item"><a href="browse-tutors.html">Browse Tutors</a></li>
        <li class="breadcrumb-item active" id="breadcrumb-name">Tutor Profile</li>
      </ol>
    </nav>
    <h1 id="header-name">Tutor Profile</h1>
  </div>
</div>

<section class="section">
  <div class="container" id="profile-container">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="row g-4">
      <div class="col-lg-4"><span class="footer-brand">Tutor<span>Hut</span></span><p>Connecting students with verified expert tutors.</p></div>
      <div class="col-6 col-lg-2"><h6>Platform</h6><a href="browse-tutors.html">Browse Tutors</a><a href="student-register.html">Register</a></div>
      <div class="col-6 col-lg-2"><h6>Company</h6><a href="about.html">About</a><a href="contact.html">Contact</a></div>
    </div>
    <div class="footer-bottom text-center">© 2025 TutorHut. All rights reserved.</div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script type="module">
  import { getTutorById, getReviews } from "./js/firebase.js";

  const RATE_LEVELS = [
    { key: "rateKS3",        label: "KS3",        desc: "Year 7–9"   },
    { key: "rateGCSE",       label: "GCSE",        desc: "Year 10–11" },
    { key: "rateALevel",     label: "A-Level",     desc: "Year 12–13" },
    { key: "rateUniversity", label: "University",  desc: ""           },
    { key: "rateAdult",      label: "Adult / Other", desc: ""         }
  ];

  const params  = new URLSearchParams(window.location.search);
  const tutorId = params.get("id");
  const cont    = document.getElementById("profile-container");

  function notFound() {
    cont.innerHTML = `
      <div class="row justify-content-center">
        <div class="col-lg-6 text-center py-5">
          <i class="bi bi-person-badge fs-1 d-block mb-3 text-muted opacity-25"></i>
          <h4 class="fw-700 mb-2">Profile not found</h4>
          <p class="text-muted mb-4">This tutor profile is not currently available.</p>
          <a href="browse-tutors.html" class="btn btn-primary">Browse All Tutors</a>
        </div>
      </div>`;
  }

  if (!tutorId) { notFound(); } else {
    Promise.all([getTutorById(tutorId), getReviews(tutorId)]).then(([t, reviews]) => {
      if (!t) { notFound(); return; }
      const revList = Array.isArray(reviews) ? reviews : [];

      document.getElementById("header-name").textContent  = t.name || "Tutor Profile";
      document.getElementById("breadcrumb-name").textContent = t.name || "Tutor Profile";
      document.title = `${t.name || "Tutor"} – TutorHut`;

      const initial  = (t.name || "T").charAt(0).toUpperCase();
      const verified = t.verified === "true" || t.verified === true;
      const dbsOk    = t.dbsVerificationStatus === "Verified";

      const verBadge = verified
        ? `<span class="badge bg-success"><i class="bi bi-patch-check-fill me-1"></i>Verified Tutor</span>` : "";
      const dbsBadge = dbsOk
        ? `<span class="badge bg-info text-dark"><i class="bi bi-shield-fill-check me-1"></i>DBS Checked</span>` : "";

      const subjects = (t.subjects || "").split(",").map(s => s.trim()).filter(Boolean);
      const subTags  = subjects.map(s => `<span class="badge-subject">${s}</span>`).join(" ");

      const rates = RATE_LEVELS.map(lvl => {
        const r = parseInt(t[lvl.key]) || 0;
        return `<tr>
          <td><strong>${lvl.label}</strong>${lvl.desc ? `<br><small class="text-muted">${lvl.desc}</small>` : ""}</td>
          <td class="text-end">${r > 0 ? `<span class="fw-600 text-primary">£${r}/hr</span>` : `<span class="text-muted">Rate on request</span>`}</td>
        </tr>`;
      }).join("");

      const avail     = t.availability || "";
      const daysMatch = avail.match(/Days:\s*([^|]+)/);
      const timesMatch = avail.match(/Times:\s*([^|]+)/);
      const days  = daysMatch  ? daysMatch[1].trim().split(",").map(d => `<span class="avail-chip"><i class="bi bi-calendar3 me-1"></i>${d.trim()}</span>`).join("") : "";
      const times = timesMatch ? timesMatch[1].trim().split(",").map(d => `<span class="avail-chip"><i class="bi bi-clock me-1"></i>${d.trim()}</span>`).join("") : "";

      cont.innerHTML = `
        <div class="row g-4">

          <!-- Left sidebar -->
          <div class="col-lg-4">
            <div class="card p-4 mb-4 text-center">
              <div class="profile-avatar mx-auto mb-3">${initial}</div>
              <h4 class="fw-700 mb-2">${t.name || ""}</h4>
              <div class="d-flex flex-wrap gap-2 justify-content-center mb-3">
                ${verBadge}${dbsBadge}
              </div>
              ${t.qualification ? `<p class="small text-muted mb-1"><i class="bi bi-mortarboard me-1"></i>${t.qualification}</p>` : ""}
              ${t.field         ? `<p class="small text-muted mb-1"><i class="bi bi-book me-1"></i>Specialises in ${t.field}</p>` : ""}
              ${t.experience    ? `<p class="small text-muted mb-3"><i class="bi bi-briefcase me-1"></i>${t.experience}</p>` : ""}
              <a href="connect-tutor.html?tutorid=${t.id}" class="btn btn-primary w-100">
                <i class="bi bi-person-check me-2"></i>Connect with ${t.name ? t.name.split(" ")[0] : "Tutor"}
              </a>
            </div>

            <!-- Rate Table -->
            <div class="card p-4">
              <h6 class="fw-700 mb-3"><i class="bi bi-currency-pound me-2 text-primary"></i>Hourly Rates</h6>
              <table class="table table-sm rate-table mb-0">
                <tbody>${rates}</tbody>
              </table>
              <p class="small text-muted mt-2 mb-0">Rates are per hour. Contact the tutor to confirm availability and exact pricing.</p>
            </div>
          </div>

          <!-- Main content -->
          <div class="col-lg-8">

            ${t.bio ? `
            <div class="card p-4 mb-4">
              <h5 class="fw-700 mb-3"><i class="bi bi-person-lines-fill me-2 text-primary"></i>About</h5>
              <p class="mb-0" style="line-height:1.7">${t.bio.replace(/\n/g, "<br>")}</p>
            </div>` : ""}

            ${subjects.length ? `
            <div class="card p-4 mb-4">
              <h5 class="fw-700 mb-3"><i class="bi bi-journal-bookmark me-2 text-primary"></i>Subjects</h5>
              <div class="d-flex flex-wrap gap-2">${subTags}</div>
            </div>` : ""}

            ${(days || times) ? `
            <div class="card p-4 mb-4">
              <h5 class="fw-700 mb-3"><i class="bi bi-calendar3 me-2 text-primary"></i>Availability</h5>
              ${days  ? `<div class="mb-2"><div class="small fw-600 text-muted mb-1">Days</div>${days}</div>` : ""}
              ${times ? `<div><div class="small fw-600 text-muted mb-1">Time Slots</div>${times}</div>` : ""}
            </div>` : ""}

            <!-- Reviews -->
            <div class="card p-4 mb-4">
              ${(function() {
                if (!revList.length) {
                  return `<h5 class="fw-700 mb-3"><i class="bi bi-star me-2 text-primary"></i>Reviews</h5>
                    <div class="review-placeholder">
                      <i class="bi bi-chat-square-text fs-2 d-block mb-2 opacity-50"></i>
                      <p class="small mb-0">No reviews yet.</p>
                    </div>`;
                }
                const avg  = (revList.reduce((s, r) => s + parseInt(r.rating || 0), 0) / revList.length).toFixed(1);
                const stars = n => "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n));
                const cards = revList.map(r => {
                  const d = r.createdAt ? new Date(r.createdAt).toLocaleDateString("en-GB", {day:"numeric",month:"short",year:"numeric"}) : "";
                  return `<div class="border rounded p-3 mb-2">
                    <div class="d-flex justify-content-between align-items-start mb-1">
                      <div>
                        <span style="color:#F59E0B;letter-spacing:1px">${stars(parseInt(r.rating||0))}</span>
                        <strong class="ms-2 small">${r.studentName || "Student"}</strong>
                      </div>
                      <small class="text-muted">${d}</small>
                    </div>
                    ${r.reviewText ? `<p class="small mb-0 text-muted">${r.reviewText.replace(/</g,"&lt;")}</p>` : ""}
                  </div>`;
                }).join("");
                return `<div class="d-flex align-items-center gap-3 mb-3">
                    <h5 class="fw-700 mb-0"><i class="bi bi-star-fill text-warning me-2"></i>Reviews</h5>
                    <span class="badge bg-warning text-dark px-3 py-2" style="font-size:.95rem">★ ${avg}</span>
                    <span class="text-muted small">${revList.length} review${revList.length !== 1 ? "s" : ""}</span>
                  </div>
                  ${cards}`;
              })()}
            </div>

            <!-- CTA -->
            <div class="card p-4" style="background:var(--primary-light);border-color:var(--primary)">
              <div class="d-flex align-items-center gap-3 flex-wrap">
                <div class="flex-grow-1">
                  <h5 class="fw-700 mb-1">Ready to learn with ${t.name ? t.name.split(" ")[0] : "this tutor"}?</h5>
                  <p class="text-muted mb-0 small">Submit a request and our team will confirm the session details.</p>
                </div>
                <a href="connect-tutor.html?tutorid=${t.id}" class="btn btn-primary flex-shrink-0">
                  <i class="bi bi-person-check me-2"></i>Connect Now
                </a>
              </div>
            </div>

          </div>
        </div>`;
    }).catch(err => { console.error(err); notFound(); });
  }
</script>
<script type="module" src="js/navbar.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
